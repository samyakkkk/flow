services:
  # ── FalkorDB (graph store + browser UI) ──────────────────────────────────
  falkordb:
    image: falkordb/falkordb:latest
    ports:
      - "6379:6379"   # Redis protocol (graph-gateway client)
      - "3000:3000"   # FalkorDB browser UI (internal only; expose via Caddy if needed)
    volumes:
      - falkordb-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # ── Graph gateway (typed verb API over FalkorDB, port 7433) ──────────────
  gateway:
    build:
      context: ./graph-gateway
    ports:
      - "7433:7433"
    environment:
      - FALKOR_HOST=falkordb
      - FALKOR_PORT=6379
      - GRAPH_NAME=${GRAPH_NAME:-acme-v1}
    volumes:
      - gateway-journal:/app/data  # append-only journal (journal.jsonl)
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:7433/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  # ── Orchestrator (event bus, classifier, policy router, port 7500) ────────
  orchestrator:
    build:
      context: ./orchestrator
    ports:
      - "7500:7500"
    environment:
      # Required
      - FLOW_ADMIN_TOKEN=${FLOW_ADMIN_TOKEN}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GATEWAY_URL=http://gateway:7433
      - GRAPH_NAME=${GRAPH_NAME:-acme-v1}
      # OpenCode limitation: the opencode CLI is NOT bundled in this container.
      # Index/answer jobs will fail unless you mount opencode or use hybrid mode.
      # Set FLOW_FAKE_OPENCODE=1 for smoke-testing without real opencode.
      - FLOW_FAKE_OPENCODE=${FLOW_FAKE_OPENCODE:-}
      # Optional — Slack Socket Mode
      - SLACK_BOT_TOKEN=${SLACK_BOT_TOKEN:-}
      - SLACK_APP_TOKEN=${SLACK_APP_TOKEN:-}
      # Optional — Linear
      - LINEAR_API_KEY=${LINEAR_API_KEY:-}
      - LINEAR_WEBHOOK_SECRET=${LINEAR_WEBHOOK_SECRET:-}
      - LINEAR_DEFAULT_TEAM_ID=${LINEAR_DEFAULT_TEAM_ID:-}
      # Optional — GitHub
      - GITHUB_PAT=${GITHUB_PAT:-}
      - GITHUB_WEBHOOK_SECRET=${GITHUB_WEBHOOK_SECRET:-}
      - FLOW_WATCHED_REPOS=${FLOW_WATCHED_REPOS:-}
      # Optional — Fireflies
      - FIREFLIES_API_KEY=${FIREFLIES_API_KEY:-}
      # Tuning
      - CLASSIFIER_MODEL=${CLASSIFIER_MODEL:-}
      - GRAPH_BUILDER_MODEL=${GRAPH_BUILDER_MODEL:-}
      - FLOW_CONFIDENCE_FLOOR=${FLOW_CONFIDENCE_FLOOR:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - orchestrator-data:/app/data  # SQLite (flow.db) and other persistent data
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:7500/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Dashboard (Next.js UI, port 7600) ────────────────────────────────────
  dashboard:
    build:
      context: ./dashboard
    ports:
      - "7600:7600"
    environment:
      - ORCHESTRATOR_URL=http://orchestrator:7500
      - GATEWAY_URL=http://gateway:7433
      - FLOW_ADMIN_TOKEN=${FLOW_ADMIN_TOKEN}
    depends_on:
      orchestrator:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:7600/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

volumes:
  falkordb-data:
  gateway-journal:
  orchestrator-data:
