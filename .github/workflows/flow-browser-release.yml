name: Flow browser release

on:
  pull_request:
    branches: [main-v2, release]
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable version (X.Y.Z); defaults to next patch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flow-browser-release-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
  queue: max

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Validate version and pin source
        id: version
        env:
          FLOW_VERSION: ${{ inputs.version }}
        run: node scripts/flow-release-version.mjs
      - name: Test installer and launcher
        run: node --test scripts/prepare-browser-native.test.mjs scripts/flow-release-version.test.mjs scripts/flow-release.test.mjs scripts/instances/launcher.test.mjs scripts/instances/release-control.test.mjs scripts/instances/release-handoff.test.mjs
      - name: Prepare release source
        env:
          FLOW_VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-source"
          git archive HEAD -- . ':(exclude).repos' | tar -xf - -C "$RUNNER_TEMP/flow-source"
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const relative of ['apps/server/package.json', 'apps/desktop/package.json', 'apps/web/package.json', 'packages/contracts/package.json']) {
            const file = join(process.env.RUNNER_TEMP, 'flow-source', relative);
            const pkg = JSON.parse(readFileSync(file, 'utf8'));
            writeFileSync(file, JSON.stringify({...pkg, version: process.env.FLOW_VERSION}, null, 2) + '\n');
          }
          JS
          mkdir -p release-browser
          cp "$RUNNER_TEMP/flow-source/scripts/flow-release.mjs" release-browser/flow-release.mjs
          tar -czf release-browser/flow-source.tar.gz -C "$RUNNER_TEMP/flow-source" .
          (cd release-browser && sha256sum flow-source.tar.gz > flow-source.tar.gz.sha256)
      - name: Verify source installation
        working-directory: ${{ runner.temp }}/flow-source
        run: |
          bash scripts/install-flow.sh --prefix "$RUNNER_TEMP/flow-install"
          node scripts/verify-browser-install.mjs
          node_modules/.bin/vp test run apps/server/src/flowBrowserUpdate.test.ts apps/web/src/components/sidebar/flowBrowserUpdate.test.ts
          node apps/server/src/bin.ts --version
      - uses: actions/upload-artifact@v4
        with:
          name: flow-browser-release
          path: release-browser/*
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: flow-browser-release
          path: release-browser
      - name: Publish stable browser release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLOW_TAG: ${{ needs.package.outputs.tag }}
          FLOW_COMMIT: ${{ needs.package.outputs.commit }}
        run: |
          gh release create "$FLOW_TAG" release-browser/* \
            --target "$FLOW_COMMIT" --title "Flow ${FLOW_TAG#flow-v}" \
            --generate-notes --latest
