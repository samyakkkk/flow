name: Flow browser release

on:
  pull_request:
    branches: [main-v2, release]
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      version:
        description: Optional stable version (X.Y.Z); defaults to next patch
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: flow-browser-release-${{ github.event.pull_request.number || 'publish' }}
  cancel-in-progress: false
  queue: max

jobs:
  version:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Validate version and pin source
        id: version
        env:
          FLOW_VERSION: ${{ inputs.version }}
        run: node scripts/flow-release-version.mjs
  package:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        # Desktop apps install this release on first launch, so every platform
        # the desktop ships for that the CLI supports needs a bundle here.
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Install Linux native build prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y build-essential libcurl4-openssl-dev libssl-dev zlib1g-dev libexpat1-dev gettext cmake ninja-build
      - name: Test installer and launcher
        if: runner.os == 'macOS'
        run: node --test scripts/retire-legacy-flow.test.mjs scripts/flow-bootstrap.test.mjs scripts/prepare-browser-lockfile.test.mjs scripts/flow-bundle.test.mjs scripts/prepare-browser-native.test.mjs scripts/flow-release-version.test.mjs scripts/flow-release.test.mjs scripts/flow-cli.test.mjs scripts/instances/launcher.test.mjs scripts/instances/release-control.test.mjs scripts/instances/release-handoff.test.mjs
      - name: Prepare release source
        shell: bash
        env:
          FLOW_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir -p "$RUNNER_TEMP/flow-source" release-browser
          git archive HEAD -- . ':(exclude).repos' | tar -xf - -C "$RUNNER_TEMP/flow-source"
          node --input-type=module - <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          for (const relative of ['apps/server/package.json', 'apps/desktop/package.json', 'apps/web/package.json', 'packages/contracts/package.json']) {
            const file = join(process.env.RUNNER_TEMP, 'flow-source', relative);
            const pkg = JSON.parse(readFileSync(file, 'utf8'));
            writeFileSync(file, JSON.stringify({...pkg, version: process.env.FLOW_VERSION}, null, 2) + '\n');
          }
          JS
      - name: Package release source and bootstrap
        if: runner.os == 'macOS'
        run: |
          cp "$RUNNER_TEMP/flow-source/scripts/flow-release.mjs" release-browser/flow-release.mjs
          tar --no-xattrs --no-acls -czf release-browser/flow-source.tar.gz -C "$RUNNER_TEMP/flow-source" .
          (cd release-browser && shasum -a 256 flow-source.tar.gz > flow-source.tar.gz.sha256)
      - name: Build and verify ready-to-run package
        env:
          FLOW_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/build-browser-bundle.mjs "$RUNNER_TEMP/flow-source" "$GITHUB_WORKSPACE/release-browser" "$FLOW_VERSION"
      - name: Verify CLI and Brain behavior with the bundled runtime
        working-directory: ${{ runner.temp }}/flow-source
        run: runtime/bin/node --test scripts/cli-brains.test.mjs flow-t3/shared/bin/test/*.test.mjs
      - name: Smoke test installation beside another flow command
        shell: bash
        run: |
          test_home="$RUNNER_TEMP/cli-user"
          mkdir -p "$test_home/.local/bin" "$test_home/staging"
          printf 'someone else owns this\n' > "$test_home/.local/bin/flow"
          archive=$(find release-browser -name 'flow-browser-*.tar.gz' -print -quit)
          digest=$(cut -d ' ' -f 1 "$archive.sha256")
          tar -xzf "$archive" -C "$test_home/staging"
          HOME="$test_home" "$test_home/staging/runtime/bin/node" "$test_home/staging/scripts/flow-release.mjs" install-bundle "$test_home/staging" "$digest"
          test "$(cat "$test_home/.local/bin/flow")" = 'someone else owns this'
          HOME="$test_home" "$test_home/.local/share/flow-browser/bin/flow" status
      - name: Pin the dashboard installer to this release
        if: runner.os == 'Linux'
        env:
          FLOW_VERSION: ${{ needs.version.outputs.version }}
        # install-cloud.sh is the asset name the deployed dashboard may still fetch.
        run: |
          sed "s/__FLOW_CLI_VERSION__/$FLOW_VERSION/g" install.sh > release-browser/install-cli.sh
          cp release-browser/install-cli.sh release-browser/install-cloud.sh
      - uses: actions/upload-artifact@v4
        with:
          name: flow-browser-release-${{ matrix.os }}
          path: release-browser/*
          if-no-files-found: error
  # Windows runs the server and browser UI against a Brain hosted elsewhere;
  # FalkorDB has no Windows build, so this bundle carries no database.
  package-windows:
    needs: version
    runs-on: windows-2025
    # Not yet proven end to end, and not published: a failure here must never
    # hold back or fail a macOS/Linux release. Remove once it is green.
    continue-on-error: true
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Test installer and launcher
        run: node --test scripts/bundle-links.test.mjs scripts/flow-cli.test.mjs scripts/instances/style.test.mjs
      - name: Prepare release source
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\flow-source", release-browser | Out-Null
          # .claude holds a symlink, which Windows cannot extract without a privilege.
          git archive --format=tar -o "$env:RUNNER_TEMP\flow-source.tar" HEAD -- . ':(exclude).repos' ':(exclude).claude'
          & "$env:SystemRoot\System32\tar.exe" -xf "$env:RUNNER_TEMP\flow-source.tar" -C "$env:RUNNER_TEMP\flow-source"
          if ($LASTEXITCODE -ne 0) { throw 'Could not extract the release source.' }
      - name: Build and verify ready-to-run package
        env:
          FLOW_VERSION: ${{ needs.version.outputs.version }}
        run: node scripts/build-browser-bundle.mjs "$env:RUNNER_TEMP\flow-source" "$env:GITHUB_WORKSPACE\release-browser" "$env:FLOW_VERSION"
      - name: Pin the Windows installer to this release
        env:
          FLOW_VERSION: ${{ needs.version.outputs.version }}
        run: (Get-Content install.ps1 -Raw).Replace('__FLOW_CLI_VERSION__', $env:FLOW_VERSION) | Set-Content -NoNewline release-browser\install.ps1
      - name: Install as a new user would, then start Flow
        run: |
          $ErrorActionPreference = 'Stop'
          $env:USERPROFILE = "$env:RUNNER_TEMP\cli user"   # a profile with a space in it
          $env:FLOW_RELEASE_HOME = "$env:USERPROFILE\.local\share\flow-browser"
          $staging = "$env:USERPROFILE\staging"
          New-Item -ItemType Directory -Force $staging | Out-Null
          $archive = (Get-ChildItem release-browser\flow-browser-win32-x64.tar.gz).FullName
          "{0:N0} MB" -f ((Get-Item $archive).Length / 1MB)
          $digest = (Get-Content "$archive.sha256").Split()[0]
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $staging
          & "$staging\runtime\bin\node.exe" "$staging\scripts\flow-release.mjs" install-bundle $staging $digest
          if ($LASTEXITCODE -ne 0) { throw 'install-bundle failed' }
          $flow = "$env:FLOW_RELEASE_HOME\bin\flow.cmd"
          & $flow --no-open
          if ($LASTEXITCODE -ne 0) { Get-Content "$env:FLOW_RELEASE_HOME\instance-home\instances\primary\runtime.log" -Tail 80; throw 'flow did not start' }
          & $flow status
          & $flow stop
      - uses: actions/upload-artifact@v4
        with:
          name: flow-browser-windows-${{ github.run_id }}
          path: release-browser/*
          if-no-files-found: error
  publish:
    if: github.event_name != 'pull_request'
    needs: [version, package]
    runs-on: ubuntu-24.04
    # ~600 MB per release, uploaded twice; GitHub's upload service can be slow.
    timeout-minutes: 120
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: flow-browser-release-*
          merge-multiple: true
          path: release-browser
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.commit }}
          sparse-checkout: scripts/publish-release-assets.mjs
          sparse-checkout-cone-mode: false
          path: release-scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24.13.1
      - name: Publish stable browser release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FLOW_TAG: ${{ needs.version.outputs.tag }}
          FLOW_COMMIT: ${{ needs.version.outputs.commit }}
        run: |
          set -euo pipefail
          node release-scripts/scripts/publish-release-assets.mjs "$FLOW_TAG" release-browser \
            --title "Flow ${FLOW_TAG#flow-v}" --target "$FLOW_COMMIT" --generate-notes --latest
          # CLIs installed from the dashboard before the feeds were unified only
          # watch this tag name. One update moves them onto flow-v*; drop this
          # mirror once no supported install predates the unification.
          node release-scripts/scripts/publish-release-assets.mjs "flow-cloud-cli-v${FLOW_TAG#flow-v}" release-browser \
            --title "Flow ${FLOW_TAG#flow-v} (earlier Cloud CLI installs)" --target "$FLOW_COMMIT" \
            --notes "Same files as $FLOW_TAG, for CLIs installed from the dashboard before the feeds were unified."
