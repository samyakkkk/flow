# ─────────────────────────────────────────────────────────────────────────────
# ⚠️  This is NOT how you run Flow locally. Use the `flow` CLI:
#
#         npm install && npm install -g .
#         flow up <name>
#
#   This compose file is the HEADLESS SERVER deploy (EC2 or any Docker host).
#   It runs the same `flow` CLI inside one container (deploy/entrypoint.sh:
#   `flow project create --mode prod` + `flow up`), with FalkorDB as a
#   sidecar. Only the dashboard port is published — gateway and orchestrator
#   stay on 127.0.0.1 inside the container, exactly like a laptop install.
#
#   Run from this directory:
#         cd deploy && docker compose up --build -d
#         docker compose logs -f flow     # the one-time setup code prints here
#
#   First boot prints a SETUP CODE — open https://your-domain/login (or
#   http://<host>:7600/login) and create the owner account with it.
# ─────────────────────────────────────────────────────────────────────────────

services:
  falkordb:
    image: falkordb/falkordb:latest
    # No published ports: only Flow (on the compose network) talks to it.
    # DURABILITY: FalkorDB's data dir is /var/lib/falkordb/data (redis `dir`),
    # NOT /data — the volume MUST mount there or the graph lives only in the
    # container's ephemeral layer and every restart/redeploy wipes the brain.
    # AOF (appendonly) persists every write immediately; RDB snapshots alone
    # miss small graphs (the default 100-writes-in-300s threshold never fires
    # for a modest index), so a restart before a snapshot loses everything.
    environment:
      - REDIS_ARGS=--appendonly yes --appendfsync everysec
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  flow:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    ports:
      # Dashboard — front with Caddy/HTTPS in production (see ec2.md).
      # Override the host port when 7600 is taken (e.g. a local flow):
      #   FLOW_DASHBOARD_PORT=8700 docker compose up
      - "${FLOW_DASHBOARD_PORT:-7600}:7600"
    environment:
      - FLOW_PROJECT=${FLOW_PROJECT:-main}
      # Optional: LLM key for the indexer/classifier in headless mode.
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
    volumes:
      - flow-data:/app/data # projects, auth store, SQLite, logs
    depends_on:
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e",
             "fetch('http://localhost:7600/login').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s # first boot builds the dashboard
    restart: unless-stopped

volumes:
  falkordb-data:
  flow-data:
